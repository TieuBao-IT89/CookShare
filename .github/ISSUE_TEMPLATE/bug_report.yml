name: Báo lỗi
description: Báo hành vi có thể tái hiện trong CookShare.
body:
  - type: markdown
    attributes:
      value: "Tìm Issue tương tự trước khi gửi. Không dán secrets/dữ liệu cá nhân. Lỗ hổng cần báo riêng tư theo SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: Mô tả lỗi
      description: Chức năng nào bị ảnh hưởng?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Các bước tái hiện
      description: Các bước tối thiểu, dữ liệu mẫu an toàn và tần suất gặp lỗi.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi và thực tế
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Môi trường
      description: Nhánh/tag/commit, hệ điều hành, dotnet --version, trình duyệt/viewport nếu liên quan.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Log hoặc ảnh bổ sung
      description: Che credential, token, chuỗi kết nối và dữ liệu cá nhân.
