name: CookShare .NET CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build and Test .NET 8
    runs-on: ubuntu-latest

    # Each job gets a disposable database; PR code receives no Neon credentials.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cookshare_test
          POSTGRES_PASSWORD: cookshare_test
          POSTGRES_DB: cookshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookshare_test -d cookshare_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore CookShare.sln

      - name: Build solution
        run: dotnet build CookShare.sln --configuration Release --no-restore

      - name: Run unit and integration tests
        run: dotnet test CookShare.sln --configuration Release --no-build --no-restore
        env:
          # Local service only. The test fixture applies migrations before tests.
          COOKSHARE_TEST_CONNECTION: "Host=localhost;Port=5432;Database=cookshare_test;Username=cookshare_test;Password=cookshare_test;SSL Mode=Disable"

      # Issue #32 - Code Quality
      - name: Check code formatting
        run: dotnet format whitespace CookShare.sln --verify-no-changes --no-restore

      - name: Check coding style
        run: dotnet format style CookShare.sln --verify-no-changes --no-restore --severity warn

      - name: Run code analyzers
        run: dotnet format analyzers CookShare.sln --verify-no-changes --no-restore --severity warn
